aid: medeor-therapeutics
name: Medeor Therapeutics
description: >-
  Medeor Therapeutics is a clinical-stage cellular immunotherapy company in San Mateo, California,
  developing MDR-101, a one-time cell therapy manufactured from a living kidney donor's blood that
  induces mixed chimerism so HLA-matched transplant recipients can withdraw from lifelong
  immunosuppression while preserving graft function. The platform originated in roughly two decades
  of research at Stanford University led by Dr. Samuel Strober. The company completed a Phase 3
  registration trial that exceeded its target success rate, and has since suspended operations and
  is seeking an acquirer to complete the BLA filing. Medeor is a therapeutics developer, not a
  software company: it publishes no developer portal, API, SDK, or machine-readable specification.
